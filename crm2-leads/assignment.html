<!doctype html><html><head><meta charset="utf-8"><title>CRM2 Lead Assignment</title><style>body{font-family:Arial;margin:24px;background:#f7f7f7}.card{background:#fff;padding:18px;border-radius:10px;max-width:1000px;margin:auto}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}button,select{padding:8px 12px;margin:4px}.muted{color:#666}</style></head><body><div class="card"><h2>CRM2 — Lead Assignment</h2><p class="muted">Select a batch, choose agent and assign selected unassigned leads.</p><label>Batch <select id="batch"></select></label><label>Agent <select id="agent"></select></label><button onclick="loadLeads()">Load Leads</button><button onclick="assign()">Assign Selected</button><div id="msg"></div><table><thead><tr><th><input type="checkbox" onchange="document.querySelectorAll('.lead').forEach(x=>x.checked=this.checked)"></th><th>Mobile</th><th>Customer</th><th>Product</th><th>City</th></tr></thead><tbody id="rows"></tbody></table></div><script src="config.js"></script><script>const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);async function init(){let{data:b}=await sb.from('lead_batches').select('id,file_name,created_at').order('created_at',{ascending:false});batch.innerHTML=(b||[]).map(x=>`<option value="${x.id}">${x.file_name}</option>`).join('');let{data:p}=await sb.from('profiles').select('id,full_name,role').in('role',['agent','sales_agent']);agent.innerHTML=(p||[]).map(x=>`<option value="${x.id}">${x.full_name||x.id}</option>`).join('')}async function loadLeads(){let{data,error}=await sb.from('leads').select('*').eq('batch_id',batch.value).is('assigned_to',null).eq('status','new').limit(500);rows.innerHTML=(data||[]).map(x=>`<tr><td><input class="lead" type="checkbox" value="${x.id}"></td><td>${x.mobile}</td><td>${x.customer_name||''}</td><td>${x.product_name||''}</td><td>${x.city||''}</td></tr>`).join('');msg.textContent=error?error.message:`${(data||[]).length} unassigned leads loaded`}async function assign(){let ids=[...document.querySelectorAll('.lead:checked')].map(x=>x.value);if(!ids.length)return alert('Select at least one lead');let a=agent.value;let updates=ids.map(id=>({id,assigned_to:a,status:'assigned',assigned_at:new Date().toISOString()}));let{error}=await sb.from('leads').upsert(updates);if(error){msg.textContent=error.message;return}let rows2=ids.map(id=>({lead_id:id,agent_id:a,batch_id:batch.value,assignment_date:new Date().toISOString().slice(0,10),status:'assigned'}));let r=await sb.from('lead_assignments').upsert(rows2,{onConflict:'lead_id'});msg.textContent=r.error?r.error.message:`${ids.length} leads assigned successfully`;loadLeads()}init();</script></body></html>
