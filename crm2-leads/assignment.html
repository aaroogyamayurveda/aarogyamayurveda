<!doctype html><html><head><meta charset="utf-8"><title>CRM2 Lead Assignment</title><style>body{font-family:Arial;margin:24px;background:#f7f7f7}.card{background:#fff;padding:18px;border-radius:10px;max-width:1100px;margin:auto}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}button,select{padding:8px 12px;margin:4px}.muted{color:#666}.error{color:#b42318}.ok{color:#166534;font-weight:700}</style></head><body><div class="card"><h2>CRM2 — Lead Assignment</h2><p class="muted">Select an uploaded batch, choose an agent and assign selected unassigned leads.</p><div><label>Batch <select id="batch"><option value="">Loading batches…</option></select></label><label>Agent <select id="agent"><option value="">Loading agents…</option></select></label><button id="loadBtn">Load Leads</button><button id="assignBtn">Assign Selected</button></div><div id="msg"></div><table><thead><tr><th><input id="all" type="checkbox"></th><th>Mobile</th><th>Customer</th><th>Product</th><th>City</th></tr></thead><tbody id="rows"><tr><td colspan="5">Select a batch and agent.</td></tr></tbody></table></div><script src="./config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const el=id=>document.getElementById(id);const msg=t=>{el('msg').className=t&&/^Error|Failed|No /.test(t)?'error':'ok';el('msg').textContent=t||''};async function init(){const auth=await sb.auth.getUser();if(auth.error){msg('Error: '+auth.error.message);return}const bq=await sb.from('lead_batches').select('id,file_name,created_at,total_records,valid_records').order('created_at',{ascending:false});if(bq.error){msg('Error loading batches: '+bq.error.message);return}const aq=await sb.from('profiles').select('id,full_name,role').eq('role','agent').order('full_name');if(aq.error){msg('Error loading agents: '+aq.error.message);return}el('batch').innerHTML='<option value="">Select batch</option>'+(bq.data||[]).map(x=>`<option value="${x.id}">${x.file_name} — ${x.valid_records}/${x.total_records} valid</option>`).join('');el('agent').innerHTML='<option value="">Select agent</option>'+(aq.data||[]).map(x=>`<option value="${x.id}">${x.full_name||x.id}</option>`).join('');if(!(bq.data||[]).length)msg('No uploaded batches found. Please upload the CSV again on CRM2.')}async function loadLeads(){if(!el('batch').value||!el('agent').value){msg('Select both Batch and Agent.');return}const q=await sb.from('leads').select('id,mobile,customer_name,product_name,city,lead_status,assigned_to').eq('batch_id',el('batch').value).is('assigned_to',null).eq('lead_status','new').order('created_at',{ascending:true}).limit(500);if(q.error){msg('Error loading leads: '+q.error.message);return}el('rows').innerHTML=(q.data||[]).map(x=>`<tr><td><input class="lead" type="checkbox" value="${x.id}"></td><td>${x.mobile||''}</td><td>${x.customer_name||''}</td><td>${x.product_name||''}</td><td>${x.city||''}</td></tr>`).join('')||'<tr><td colspan="5">No unassigned leads in this batch.</td></tr>';msg(`${(q.data||[]).length} unassigned leads loaded.`)}async function assign(){const ids=[...document.querySelectorAll('.lead:checked')].map(x=>x.value);const aid=el('agent').value;if(!ids.length){msg('Select at least one lead.');return}if(!aid){msg('Select an agent.');return}const now=new Date().toISOString(),today=now.slice(0,10);const updates=ids.map(id=>({id,assigned_to:aid,assigned_at:now,lead_status:'assigned',updated_at:now}));const u=await sb.from('leads').upsert(updates);if(u.error){msg('Error assigning leads: '+u.error.message);return}const rows2=ids.map(id=>({lead_id:id,agent_id:aid,assigned_by:null,assignment_date:today,status:'assigned'}));const r=await sb.from('lead_assignments').upsert(rows2,{onConflict:'lead_id'});if(r.error){msg('Leads assigned, but assignment log failed: '+r.error.message);return}msg(`${ids.length} leads assigned successfully.`);await loadLeads()}el('loadBtn').onclick=loadLeads;el('assignBtn').onclick=assign;el('all').onchange=e=>document.querySelectorAll('.lead').forEach(x=>x.checked=e.target.checked);init()})();</script></body></html>
