<!doctype html><html><head><meta charset="utf-8"><title>CRM2 Manager Report</title><style>body{font-family:Arial;margin:24px;background:#f5f7f5}.card{background:#fff;border-radius:12px;padding:18px;max-width:1200px;margin:auto}input,button{padding:8px;margin:4px}table{width:100%;border-collapse:collapse;margin-top:14px}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><div class="card"><h2>CRM2 Daily Manager Report</h2><label>Date <input id="date" type="date"></label><button onclick="load()">Load</button><div id="summary"></div><table><thead><tr><th>Agent</th><th>Assigned</th><th>Worked</th><th>Pending</th><th>Callback</th><th>Ordered</th></tr></thead><tbody id="rows"></tbody></table></div><script src="config.js"></script><script>const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);date.value=new Date().toISOString().slice(0,10);async function load(){let d=date.value;let{data:l,error}=await sb.from('leads').select('assigned_to,status,assigned_at').gte('assigned_at',d+'T00:00:00').lt('assigned_at',d+'T23:59:59.999');if(error)return summary.textContent=error.message;let ids=[...new Set((l||[]).map(x=>x.assigned_to).filter(Boolean))];let names={};if(ids.length){let{data:p}=await sb.from('profiles').select('id,full_name').in('id',ids);(p||[]).forEach(x=>names[x.id]=x.full_name||x.id)}let m={};(l||[]).forEach(x=>{let k=x.assigned_to;if(!m[k])m[k]={name:names[k]||k,assigned:0,worked:0,pending:0,callback:0,ordered:0};let r=m[k];r.assigned++;if(x.status==='assigned')r.pending++;if(['worked','in_progress','callback','ordered'].includes(x.status))r.worked++;if(x.status==='callback')r.callback++;if(x.status==='ordered')r.ordered++});let vals=Object.values(m);summary.textContent=`${vals.length} agents | ${vals.reduce((a,x)=>a+x.assigned,0)} assigned | ${vals.reduce((a,x)=>a+x.worked,0)} worked`;rows.innerHTML=vals.map(x=>`<tr><td>${x.name}</td><td>${x.assigned}</td><td>${x.worked}</td><td>${x.pending}</td><td>${x.callback}</td><td>${x.ordered}</td></tr>`).join('')}load();</script></body></html>
