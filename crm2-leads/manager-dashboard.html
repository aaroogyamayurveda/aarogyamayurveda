<!doctype html><html><head><meta charset="utf-8"><title>CRM2 Manager Dashboard</title><style>body{font-family:Arial;margin:24px;background:#f7f7f7}.wrap{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:white;padding:16px;border-radius:10px}.num{font-size:28px;font-weight:bold}</style></head><body><div class="wrap"><h2>Manager Daily Control</h2><div class="grid"><div class="card">Today's Assigned<div class="num" id="assigned">0</div></div><div class="card">Worked<div class="num" id="worked">0</div></div><div class="card">Pending<div class="num" id="pending">0</div></div><div class="card">Callbacks<div class="num" id="callbacks">0</div></div><div class="card">Today's Orders<div class="num" id="orders">0</div></div><div class="card">Active Agents<div class="num" id="agents">0</div></div></div><h3>Agent-wise Work</h3><div class="card"><table id="tbl" style="width:100%"><thead><tr><th>Agent</th><th>Assigned</th><th>Worked</th><th>Pending</th></tr></thead><tbody></tbody></table></div></div><script src="config.js"></script><script>const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);async function load(){let today=new Date().toISOString().slice(0,10);let{data:l}=await sb.from('leads').select('assigned_to,status,assigned_at').not('assigned_to','is',null);let all=(l||[]).filter(x=>(x.assigned_at||'').slice(0,10)===today);assigned.textContent=all.length;worked.textContent=all.filter(x=>x.status==='in_progress'||x.status==='worked'||x.status==='callback').length;pending.textContent=all.filter(x=>x.status==='assigned').length;callbacks.textContent=all.filter(x=>x.status==='callback').length;let{count:oc}=await sb.from('orders').select('*',{count:'exact',head:true}).gte('created_at',today+'T00:00:00');orders.textContent=oc||0;let{data:p}=await sb.from('profiles').select('id,full_name,role').in('role',['agent','sales_agent']);let map={};(p||[]).forEach(x=>map[x.id]={name:x.full_name||x.id,a:0,w:0,p:0});all.forEach(x=>{if(map[x.assigned_to]){map[x.assigned_to].a++;if(x.status==='assigned')map[x.assigned_to].p++;else map[x.assigned_to].w++}});agents.textContent=Object.values(map).filter(x=>x.a>0).length;tbl.querySelector('tbody').innerHTML=Object.values(map).filter(x=>x.a>0).map(x=>`<tr><td>${x.name}</td><td>${x.a}</td><td>${x.w}</td><td>${x.p}</td></tr>`).join('')}load();</script></body></html>
