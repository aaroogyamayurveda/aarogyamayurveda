<!doctype html><html><head><meta charset="utf-8"><title>CRM2 Today's Calling Queue</title><style>body{font-family:Arial;margin:24px;background:#f7f7f7}.card{background:#fff;padding:18px;border-radius:10px;max-width:1100px;margin:auto}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}button{padding:7px 10px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#eef;padding:10px;border-radius:8px;min-width:110px}</style></head><body><div class="card"><h2>Today's Calling Queue</h2><div class="stats"><div class="stat">Assigned: <b id="assigned">0</b></div><div class="stat">Worked: <b id="worked">0</b></div><div class="stat">Pending: <b id="pending">0</b></div></div><table><thead><tr><th>Mobile</th><th>Customer</th><th>Product</th><th>City</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div><script src="config.js"></script><script>const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);async function load(){let{data:{user}}=await sb.auth.getUser();if(!user)return location.href='../crm/index.html';let{data,error}=await sb.from('leads').select('*').eq('assigned_to',user.id).in('status',['assigned','in_progress','callback']).order('assigned_at',{ascending:true});let d=data||[];assigned.textContent=d.length;worked.textContent=d.filter(x=>x.status==='in_progress'||x.status==='callback').length;pending.textContent=d.filter(x=>x.status==='assigned').length;rows.innerHTML=d.map(x=>`<tr><td>${x.mobile}</td><td>${x.customer_name||''}</td><td>${x.product_name||''}</td><td>${x.city||''}</td><td>${x.status}</td><td><button onclick="openLead('${x.id}')">Open</button></td></tr>`).join('');if(error)console.error(error)}function openLead(id){sessionStorage.setItem('crm2_active_lead',id);location.href='../crm/index.html'}load();</script></body></html>
