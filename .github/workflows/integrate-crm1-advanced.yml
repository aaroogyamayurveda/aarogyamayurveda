name: Integrate CRM1 Advanced Layer

on:
  push:
    paths:
      - 'crm1/advanced-business-layer.js'
      - '.github/workflows/integrate-crm1-advanced.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject advanced layer loader without replacing CRM1
        shell: python
        run: |
          from pathlib import Path
          p = Path('crm1/index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="./advanced-business-layer.js"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('CRM1 index.html does not contain </body>; refusing unsafe modification')
              text = text.replace(marker, tag + '\n' + marker, 1)
              p.write_text(text, encoding='utf-8')
              print('Injected advanced layer loader')
          else:
              print('Advanced layer loader already present')

      - name: Commit integration if changed
        shell: bash
        run: |
          if git diff --quiet -- crm1/index.html; then
            echo 'No CRM1 integration change required.'
            exit 0
          fi
          git config user.name 'Aaroogyam CRM Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crm1/index.html
          git commit -m 'Integrate CRM1 advanced business layer [skip ci]'
          git push
