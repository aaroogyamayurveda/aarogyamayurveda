<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aaroogyam CRM — Create Order</title>
<style>
:root{--g:#0b6b45;--gl:#eaf7f1;--bd:#d7e2dc;--txt:#1e2a24;--mut:#68766f;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:#f5f8f6;font-family:Inter,Arial,sans-serif;color:var(--txt)}
.top{background:#fff;border-bottom:1px solid var(--bd);padding:14px 22px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.brand{font-weight:800;color:var(--g);font-size:20px}.user{font-size:13px;color:var(--mut)}
.wrap{max-width:1180px;margin:22px auto;padding:0 14px}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #00000008}
h2{margin:0 0 4px;font-size:20px}.sub{color:var(--mut);font-size:13px;margin-bottom:18px}
h3{font-size:15px;margin:0 0 14px;color:var(--g);padding-bottom:8px;border-bottom:1px solid #edf2ef}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}
label{font-size:12px;font-weight:700;color:#47544e}input,select,textarea{width:100%;border:1px solid #cfdad4;border-radius:7px;padding:10px;font-size:14px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 2px #0b6b4514}
textarea{min-height:72px;resize:vertical}.req{color:var(--red)}
.actions{display:flex;justify-content:flex-end;gap:10px;align-items:center}.btn{border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer}.primary{background:var(--g);color:#fff}.secondary{background:#edf3ef;color:#234238}
.summary{background:var(--gl);border:1px solid #cfe8dc;border-radius:9px;padding:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.sum b{display:block;font-size:18px}.sum span{font-size:11px;color:var(--mut)}
.msg{margin-top:12px;font-size:13px}.ok{color:var(--g)}.err{color:var(--red)}
.hidden{display:none}.existing{font-size:12px;color:var(--g);margin-top:4px}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Aaroogyam CRM</div>
  <div class="user" id="agentInfo">Create Order</div>
</header>

<main class="wrap">
  <div class="card">
    <h2>Create New Order</h2>
    <div class="sub">Customer + Order एक ही screen पर — पुराने CRM के Create Order workflow के अनुसार।</div>

    <form id="orderForm" novalidate>
      <div class="card" style="padding:16px;background:#fbfdfc">
        <h3>1. Customer Details</h3>
        <div class="grid">
          <div class="field">
            <label>Customer Name <span class="req">*</span></label>
            <input id="customer_name" name="customer_name" maxlength="80" required
                   pattern="[A-Za-zÀ-ÖØ-öø-ÿ .'-]+">
          </div>
          <div class="field">
            <label>Mobile Number <span class="req">*</span></label>
            <input id="mobile" name="mobile" inputmode="numeric" maxlength="10" required
                   pattern="[6-9][0-9]{9}" placeholder="10 digit mobile">
            <div id="existing" class="existing"></div>
          </div>
          <div class="field">
            <label>Alternate Mobile</label>
            <input id="alternate_mobile" name="alternate_mobile" inputmode="numeric" maxlength="10"
                   pattern="[6-9][0-9]{9}">
          </div>
          <div class="field">
            <label>Age</label><input id="age" name="age" type="number" min="1" max="120">
          </div>
          <div class="field">
            <label>Gender</label>
            <select id="gender" name="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select>
          </div>
          <div class="field">
            <label>Pincode <span class="req">*</span></label>
            <input id="pincode" name="pincode" inputmode="numeric" maxlength="6" required pattern="[0-9]{6}">
          </div>
          <div class="field">
            <label>City <span class="req">*</span></label><input id="city" name="city" maxlength="60" required>
          </div>
          <div class="field">
            <label>State <span class="req">*</span></label><input id="state" name="state" value="Madhya Pradesh" maxlength="60" required>
          </div>
          <div class="field full">
            <label>Complete Delivery Address <span class="req">*</span></label>
            <textarea id="address" name="address" maxlength="350" required></textarea>
          </div>
        </div>
      </div>

      <div class="card" style="padding:16px;background:#fbfdfc">
        <h3>2. Product & Order Details</h3>
        <div class="grid">
          <div class="field">
            <label>Product <span class="req">*</span></label>
            <select id="product_id" name="product_id" required><option value="">Loading products…</option></select>
          </div>
          <div class="field">
            <label>Quantity <span class="req">*</span></label>
            <input id="quantity" name="quantity" type="number" min="1" max="99" value="1" required>
          </div>
          <div class="field">
            <label>Product Amount (₹) <span class="req">*</span></label>
            <input id="product_amount" name="product_amount" type="number" min="0" required>
          </div>
          <div class="field">
            <label>Shipping Charge (₹)</label>
            <input id="shipping_charge" name="shipping_charge" type="number" min="0" value="0">
          </div>
          <div class="field">
            <label>Discount (₹)</label>
            <input id="discount" name="discount" type="number" min="0" value="0">
          </div>
          <div class="field">
            <label>Total Order Amount (₹)</label>
            <input id="total_amount" name="total_amount" type="number" readonly>
          </div>
          <div class="field">
            <label>Payment Mode <span class="req">*</span></label>
            <select id="payment_mode" name="payment_mode" required><option value="cod">COD</option><option value="prepaid">Prepaid</option></select>
          </div>
          <div class="field">
            <label>Order Type</label>
            <select id="order_type" name="order_type">
              <option value="fresh">FRESH ORDER</option>
              <option value="reorder">REORDER</option>
              <option value="urgent">URGENT ORDER</option>
              <option value="wa">WA ORDER</option>
              <option value="web">WEB ORDER</option>
            </select>
          </div>
          <div class="field">
            <label>Disposition</label>
            <select id="disposition" name="disposition">
              <option value="sale">Sale</option>
              <option value="fresh_order">FRESH ORDER</option>
              <option value="urgent_order">URGENT ORDER</option>
              <option value="prepaid">Prepaid</option>
              <option value="order_confirm">Order Confirm</option>
              <option value="reorder">REORDER</option>
            </select>
          </div>
          <div class="field full">
            <label>Scheme / Offer</label><input id="scheme" name="scheme" maxlength="200">
          </div>
          <div class="field full">
            <label>Order Remarks</label><textarea id="remarks" name="remarks" maxlength="500"></textarea>
          </div>
        </div>
      </div>

      <div class="summary">
        <div class="sum"><span>Product</span><b id="sProduct">₹0</b></div>
        <div class="sum"><span>Shipping</span><b id="sShip">₹0</b></div>
        <div class="sum"><span>Discount</span><b id="sDisc">₹0</b></div>
        <div class="sum"><span>Final Amount</span><b id="sTotal">₹0</b></div>
      </div>

      <div class="actions" style="margin-top:16px">
        <button type="button" class="btn secondary" id="resetBtn">Reset</button>
        <button type="submit" class="btn primary" id="createBtn">Create Order</button>
      </div>
      <div id="msg" class="msg"></div>
    </form>
  </div>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL="https://envziigrxkmwmamswduv.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_6ET5_koDowtTZNOMWBX7ig_DWnPDr09";
const sb=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const $=id=>document.getElementById(id);
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN");

function msg(text,ok=false){$("msg").textContent=text;$("msg").className="msg "+(ok?"ok":"err")}
function digits(id,max){$(id).addEventListener("input",()=>$(id).value=$(id).value.replace(/\D/g,"").slice(0,max))}
digits("mobile",10);digits("alternate_mobile",10);digits("pincode",6);

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){msg("Please login to CRM before creating an order.");$("createBtn").disabled=true;return null}
  $("agentInfo").textContent="Logged in — "+(session.user.email||"Agent");
  $("createBtn").disabled=false;
  return session;
}

async function loadProducts(){
  const sel=$("product_id");
  const {data,error}=await sb.from("products").select("id,product_name,price").eq("active",true).order("product_name");
  if(error){sel.innerHTML='<option value="">Products load नहीं हुए</option>';return}
  sel.innerHTML='<option value="">Select Product</option>';
  (data||[]).forEach(p=>{
    const o=document.createElement("option");
    o.value=p.id;o.textContent=`${p.product_name} — ${money(p.price)}`;o.dataset.price=p.price;
    sel.appendChild(o);
  });
}

function calc(){
  const p=Number($("product_amount").value||0),s=Number($("shipping_charge").value||0),d=Number($("discount").value||0);
  const total=Math.max(0,p+s-d);
  $("total_amount").value=total;
  $("sProduct").textContent=money(p);$("sShip").textContent=money(s);
  $("sDisc").textContent=money(d);$("sTotal").textContent=money(total);
}
["product_amount","shipping_charge","discount"].forEach(id=>$(id).addEventListener("input",calc));
$("product_id").addEventListener("change",()=>{
  const p=$("product_id").selectedOptions[0]?.dataset.price;
  if(p!==undefined)$("product_amount").value=Number(p)*Number($("quantity").value||1);
  calc();
});
$("quantity").addEventListener("input",()=>{
  const p=$("product_id").selectedOptions[0]?.dataset.price;
  if(p!==undefined)$("product_amount").value=Number(p)*Number($("quantity").value||1);
  calc();
});

let lookupTimer;
$("mobile").addEventListener("input",()=>{
  clearTimeout(lookupTimer);
  $("existing").textContent="";
  const m=$("mobile").value;
  if(!/^[6-9][0-9]{9}$/.test(m))return;
  lookupTimer=setTimeout(async()=>{
    const {data,error}=await sb.from("customers").select("*").eq("mobile",m).maybeSingle();
    if(error||!data)return;
    $("existing").textContent="Existing customer found — details loaded.";
    ["customer_name","alternate_mobile","age","gender","pincode","city","state","address"].forEach(k=>{
      if(data[k]!==null && $(k))$(k).value=data[k];
    });
  },250);
});

$("orderForm").addEventListener("submit",async e=>{
  e.preventDefault();msg("");
  const btn=$("createBtn");btn.disabled=true;
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session)throw new Error("Session expired. Please login again.");

    const name=$("customer_name").value.trim(),mobile=$("mobile").value.trim();
    if(!/^[\p{L} .'-]+$/u.test(name))throw new Error("Customer Name में numbers नहीं डालें.");
    if(!/^[6-9][0-9]{9}$/.test(mobile))throw new Error("Mobile exactly 10 digits होना चाहिए.");
    if($("alternate_mobile").value && !/^[6-9][0-9]{9}$/.test($("alternate_mobile").value))throw new Error("Alternate Mobile exactly 10 digits होना चाहिए.");
    if(!/^[0-9]{6}$/.test($("pincode").value))throw new Error("Pincode exactly 6 digits होना चाहिए.");

    let customerId;
    const existing=await sb.from("customers").select("id").eq("mobile",mobile).maybeSingle();
    if(existing.error)throw existing.error;
    const customerPayload={
      customer_name:name,mobile,
      alternate_mobile:$("alternate_mobile").value||null,
      age:$("age").value?Number($("age").value):null,
      gender:$("gender").value||null,pincode:$("pincode").value,
      city:$("city").value,state:$("state").value,address:$("address").value,
      created_by:session.user.id
    };
    if(existing.data){
      customerId=existing.data.id;
      const r=await sb.from("customers").update(customerPayload).eq("id",customerId);
      if(r.error)throw r.error;
    }else{
      const r=await sb.from("customers").insert(customerPayload).select("id").single();
      if(r.error)throw r.error;
      customerId=r.data.id;
    }

    // This page intentionally uses only the core order columns already used by
    // the current Aaroogyam CRM: customer_id, total_amount, payment_mode,
    // scheme, remarks, agent_id and order_status.
    const orderPayload={
      customer_id:customerId,total_amount:Number($("total_amount").value||0),
      payment_mode:$("payment_mode").value,
      scheme:$("scheme").value||null,remarks:$("remarks").value||null,
      agent_id:session.user.id,order_status:"new"
    };
    const o=await sb.from("orders").insert(orderPayload).select("id,order_no").single();
    if(o.error)throw o.error;

    const i=await sb.from("order_items").insert({
      order_id:o.data.id,product_id:$("product_id").value,
      quantity:Number($("quantity").value),unit_price:Number($("product_amount").value)/Number($("quantity").value)
    });
    if(i.error)throw i.error;

    msg(`Order ${o.data.order_no?"#"+o.data.order_no:"#"+o.data.id} created successfully.`,true);
    $("orderForm").reset();$("shipping_charge").value=0;$("discount").value=0;$("quantity").value=1;
    $("state").value="Madhya Pradesh";calc();
  }catch(err){
    msg(err?.message||String(err));
  }finally{btn.disabled=false}
});

$("resetBtn").onclick=()=>{ $("orderForm").reset();$("shipping_charge").value=0;$("discount").value=0;$("quantity").value=1;$("state").value="Madhya Pradesh";$("existing").textContent="";msg("");calc() };

(async()=>{await boot();await loadProducts();calc()})();
</script>
</body>
</html>
