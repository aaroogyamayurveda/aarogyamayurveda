<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aaroogyam CRM2</title><style>:root{--g:#164b30;--g2:#246743;--bg:#f4f7f5;--card:#fff;--text:#173322;--muted:#66736b;--border:#dfe7e1;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.top{background:var(--g);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1250px;margin:auto;padding:20px}.panel{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}.login{max-width:480px;margin:70px auto}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button,.tabs a{border:1px solid #cdd9cf;background:#fff;color:var(--g);padding:10px 14px;border-radius:9px;font-weight:700;text-decoration:none;cursor:pointer}.tabs button.active{background:var(--g);color:#fff}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{padding:14px;border:1px solid var(--border);border-radius:12px;background:#fff}.stat span{color:var(--muted);font-size:12px}.stat b{display:block;font-size:26px;margin-top:4px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{padding:9px}.btn{border:0;background:var(--g);color:#fff;border-radius:9px;padding:10px 13px!important;font-weight:700;cursor:pointer}.btn.alt{background:#fff;color:var(--g);border:1px solid var(--g)}input,select{border:1px solid #ccd8cf;border-radius:8px;padding:9px;background:#fff}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:9px;border-bottom:1px solid #edf1ee;font-size:13px}th{background:#f7faf7;color:var(--g)}.msg{margin-top:10px;font-size:13px}.err{color:var(--red)}.ok{color:#176534}.small{font-size:12px;color:var(--muted)}.danger{color:var(--red)}@media(max-width:700px){.wrap{padding:12px}.tabs{overflow:auto;flex-wrap:nowrap}.tabs button,.tabs a{white-space:nowrap}}</style></head><body><div class="top"><strong>Aaroogyam CRM2</strong><span id="who">Not logged in</span></div><div class="wrap"><div id="login" class="panel login"><h2>CRM2 Login</h2><div class="row"><input id="email" type="email" placeholder="Email" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" id="loginBtn">Login</button></div><div id="loginMsg" class="msg"></div></div><div id="app" class="hidden"><div class="tabs"><button data-tab="manager">Manager Dashboard</button><button data-tab="upload">CSV Upload</button><button data-tab="assign">Lead Assignment</button><button data-tab="queue">Today's Queue</button><a class="btn alt" href="../crm/">Existing CRM</a><button class="btn alt" id="logoutBtn">Logout</button></div><section id="manager" class="tab panel"></section><section id="upload" class="tab panel hidden"></section><section id="assign" class="tab panel hidden"></section><section id="queue" class="tab panel hidden"></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script>const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let me=null;const $=id=>document.getElementById(id);const setMsg=(id,text,ok=false)=>{$(id).textContent=text;$(id).className='msg '+(ok?'ok':'err')};async function boot(){const q=await sb.auth.getUser();if(q.error)return;me=q.data.user;if(!me)return;showApp();openTab('manager')}function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=me.email||''}async function login(){const q=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(q.error){setMsg('loginMsg',q.error.message);return}location.reload()}async function logout(){await sb.auth.signOut();location.reload()}function openTab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));$(id).classList.remove('hidden');if(id==='manager')renderManager();if(id==='upload')renderUpload();if(id==='assign')renderAssign();if(id==='queue')renderQueue()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>openTab(b.dataset.tab));$('loginBtn').onclick=login;$('logoutBtn').onclick=logout;function renderManager(){$('manager').innerHTML='<h2>Manager Daily Control</h2><div class="grid"><div class="stat"><span>Assigned Today</span><b id="mAssigned">0</b></div><div class="stat"><span>Worked</span><b id="mWorked">0</b></div><div class="stat"><span>Pending</span><b id="mPending">0</b></div><div class="stat"><span>Callbacks</span><b id="mCallback">0</b></div><div class="stat"><span>Today Orders</span><b id="mOrders">0</b></div><div class="stat"><span>Active Agents</span><b id="mAgents">0</b></div></div><h3>Agent-wise Work</h3><div class="small" id="mMsg"></div><table><thead><tr><th>Agent</th><th>Assigned</th><th>Worked</th><th>Pending</th><th>Callbacks</th></tr></thead><tbody id="mRows"></tbody></table>';loadManager()}async function loadManager(){const d=new Date().toISOString().slice(0,10);const l=await sb.from('leads').select('assigned_to,lead_status,assigned_at').not('assigned_to','is',null);if(l.error){$('mMsg').textContent=l.error.message;return}const a=(l.data||[]).filter(x=>(x.assigned_at||'').slice(0,10)===d);$('mAssigned').textContent=a.length;$('mWorked').textContent=a.filter(x=>['in_progress','worked','callback','ordered'].includes(x.lead_status)).length;$('mPending').textContent=a.filter(x=>x.lead_status==='assigned').length;$('mCallback').textContent=a.filter(x=>x.lead_status==='callback').length;const oq=await sb.from('orders').select('*',{count:'exact',head:true}).gte('created_at',d+'T00:00:00');$('mOrders').textContent=oq.count||0;const p=await sb.from('profiles').select('id,full_name,role').eq('is_active',true).eq('role','agent').order('full_name');if(p.error){$('mMsg').textContent=p.error.message;return}const map={};(p.data||[]).forEach(x=>map[x.id]={name:x.full_name||x.id,a:0,w:0,p:0,c:0});a.forEach(x=>{const z=map[x.assigned_to];if(!z)return;z.a++;if(x.lead_status==='assigned')z.p++;else z.w++;if(x.lead_status==='callback')z.c++});$('mAgents').textContent=Object.values(map).filter(x=>x.a>0).length;$('mRows').innerHTML=Object.values(map).filter(x=>x.a>0).map(x=>`<tr><td>${x.name}</td><td>${x.a}</td><td>${x.w}</td><td>${x.p}</td><td>${x.c}</td></tr>`).join('')||'<tr><td colspan="5">No assigned work today.</td></tr>'}function renderUpload(){$('upload').innerHTML='<h2>CSV / Excel Lead Upload</h2><p class="small">CSV columns: mobile, customer_name, product_name, address, city, state, pincode, remarks</p><input id="file" type="file" accept=".csv,text/csv"><button class="btn" id="previewBtn">Preview CSV</button><div id="preview"></div>';$('previewBtn').onclick=preview}function parseCSV(text){const lines=text.replace(/\r/g,'').split('\n').filter(x=>x.trim());if(!lines.length)return{rows:[],headers:[]};const split=line=>{const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){q=!q;continue}if(c===','&&!q){out.push(cur.trim());cur='';continue}cur+=c}out.push(cur.trim());return out};const h=split(lines.shift()).map(x=>x.toLowerCase().replace(/[^a-z0-9_ ]/g,''));const idx=(...names)=>{for(const n of names){const i=h.indexOf(n);if(i>=0)return i}return -1};const iMobile=idx('mobile','mobile number');const iName=idx('customer_name','customer name','name');const iProduct=idx('product_name','product name','product');const iAddress=idx('address');const iCity=idx('city');const iState=idx('state');const iPin=idx('pincode','pin code');const iRemarks=idx('remarks','remark','notes','note');return{rows:lines.map(line=>{const a=split(line);return{mobile:iMobile>=0?a[iMobile]||'':'',customer_name:iName>=0?a[iName]||'':'',product_name:iProduct>=0?a[iProduct]||'':'',address:iAddress>=0?a[iAddress]||'':'',city:iCity>=0?a[iCity]||'':'',state:iState>=0?a[iState]||'':'',pincode:iPin>=0?a[iPin]||'':'',remarks:iRemarks>=0?a[iRemarks]||'':''}}),headers:h}}async function preview(){const f=$('file').files[0];if(!f)return alert('Select CSV');const parsed=parseCSV(await f.text());if(parsed.rows.length&&!parsed.headers.includes('mobile')&&!parsed.headers.includes('mobile number')){setMsg('preview','CSV must contain mobile or mobile number column.');return}const all=parsed.rows;const valid=[];const invalid=[];const seen=new Set();for(const r of all){if(!/^[6-9]\d{9}$/.test(r.mobile)||seen.has(r.mobile)){invalid.push(r);continue}seen.add(r.mobile);valid.push(r)}window._crm2Rows=valid;window._crm2Meta={total:all.length,invalid:invalid.length};$('preview').innerHTML=`<p class="ok">Total ${all.length} · Valid ${valid.length} · Invalid/Duplicate ${invalid.length}</p><button class="btn" id="importBtn">Import Valid Leads</button><table><thead><tr><th>Mobile</th><th>Name</th><th>Product</th><th>City</th><th>Remarks</th></tr></thead><tbody>${valid.slice(0,100).map(x=>`<tr><td>${x.mobile}</td><td>${x.customer_name}</td><td>${x.product_name}</td><td>${x.city}</td><td>${x.remarks}</td></tr>`).join('')||'<tr><td colspan="5">No valid records.</td></tr>'}</tbody></table>`;$('importBtn').onclick=()=>saveBatch(f.name)}async function saveBatch(fileName){const rows=window._crm2Rows||[];if(!rows.length)return alert('No valid records to import');const meta=window._crm2Meta;const b=await sb.from('lead_batches').insert({file_name:fileName,total_records:meta.total,valid_records:rows.length,invalid_records:meta.invalid,uploaded_by:me.id}).select('id').single();if(b.error){setMsg('preview','Import failed: '+b.error.message);return}const payload=rows.map(x=>({...x,batch_id:b.data.id,lead_status:'new'}));const ins=await sb.from('leads').insert(payload);if(ins.error){setMsg('preview','Lead insert failed: '+ins.error.message);return}$('preview').innerHTML='<p class="ok">Batch imported successfully. You can now assign the leads.</p>';openTab('assign')}async function renderAssign(){$('assign').innerHTML='<h2>Agent Assignment</h2><div id="aMsg" class="msg"></div><div class="row"><label>Batch <select id="aBatch"><option>Loading…</option></select></label><label>Agent <select id="aAgent"><option>Loading…</option></select></label><button class="btn" id="aLoad">Load Leads</button><button class="btn" id="aAssign">Assign Selected</button></div><div id="aTable"></div>';const b=await sb.from('lead_batches').select('id,file_name,created_at,total_records,valid_records').order('created_at',{ascending:false});const p=await sb.from('profiles').select('id,full_name,role,is_active').eq('role','agent').eq('is_active',true).order('full_name');if(b.error){setMsg('aMsg','Batch load failed: '+b.error.message)}if(p.error){setMsg('aMsg','Agent load failed: '+p.error.message)}$('aBatch').innerHTML='<option value="">Select batch</option>'+(b.data||[]).map(x=>`<option value="${x.id}">${x.file_name} — ${x.valid_records}/${x.total_records} valid</option>`).join('');$('aAgent').innerHTML='<option value="">Select agent</option>'+(p.data||[]).map(x=>`<option value="${x.id}">${x.full_name||x.id}</option>`).join('');if(!(b.data||[]).length)$('aMsg').textContent='No imported batches found. First use CSV Upload → Preview CSV → Import Valid Leads.';if(!(p.data||[]).length&&!p.error)$('aMsg').textContent='No active agent profiles found.';$('aLoad').onclick=loadAssign;$('aAssign').onclick=assignSelected}async function loadAssign(){if(!$('aBatch').value||!$('aAgent').value){setMsg('aMsg','Select both Batch and Agent.');return}const q=await sb.from('leads').select('id,mobile,customer_name,product_name,city,lead_status').eq('batch_id',$('aBatch').value).is('assigned_to',null).eq('lead_status','new').order('created_at',{ascending:true}).limit(500);if(q.error){setMsg('aMsg',q.error.message);return}$('aTable').innerHTML=`<p>${(q.data||[]).length} unassigned leads</p><table><thead><tr><th><input id="allLeads" type="checkbox"></th><th>Mobile</th><th>Customer</th><th>Product</th><th>City</th></tr></thead><tbody>${(q.data||[]).map(x=>`<tr><td><input class="lid" type="checkbox" value="${x.id}"></td><td>${x.mobile}</td><td>${x.customer_name||''}</td><td>${x.product_name||''}</td><td>${x.city||''}</td></tr>`).join('')||'<tr><td colspan="5">No unassigned leads.</td></tr>'}</tbody></table>`;const all=$('allLeads');if(all)all.onchange=e=>document.querySelectorAll('.lid').forEach(x=>x.checked=e.target.checked)}async function assignSelected(){const ids=[...document.querySelectorAll('.lid:checked')].map(x=>x.value);if(!ids.length)return setMsg('aMsg','Select at least one lead.');if(!$('aAgent').value)return setMsg('aMsg','Select an agent.');const now=new Date().toISOString(),agent=$('aAgent').value;const upd=await sb.from('leads').update({assigned_to:agent,assigned_at:now,lead_status:'assigned',updated_at:now}).in('id',ids);if(upd.error)return setMsg('aMsg','Lead assignment failed: '+upd.error.message);const logs=ids.map(id=>({lead_id:id,agent_id:agent,assigned_by:me.id,assignment_date:now.slice(0,10),status:'assigned'}));const lg=await sb.from('lead_assignments').insert(logs);if(lg.error)return setMsg('aMsg','Leads assigned but assignment log failed: '+lg.error.message);setMsg('aMsg',ids.length+' leads assigned successfully.',true);loadAssign()}async function renderQueue(){$('queue').innerHTML='<h2>Today\'s Calling Queue</h2><div id="qMsg" class="msg"></div><div id="qTable"></div>';const q=await sb.from('leads').select('id,mobile,customer_name,product_name,city,lead_status,assigned_at').eq('assigned_to',me.id).in('lead_status',['assigned','in_progress','callback']).order('assigned_at',{ascending:true});if(q.error){setMsg('qMsg',q.error.message);return}const d=q.data||[];$('qTable').innerHTML=`<p>${d.length} active leads</p><table><thead><tr><th>Mobile</th><th>Customer</th><th>Product</th><th>City</th><th>Status</th><th>Action</th></tr></thead><tbody>${d.map(x=>`<tr><td>${x.mobile}</td><td>${x.customer_name||''}</td><td>${x.product_name||''}</td><td>${x.city||''}</td><td>${x.lead_status}</td><td><button class="btn" data-id="${x.id}">Open</button></td></tr>`).join('')||'<tr><td colspan="6">No assigned leads.</td></tr>'}</tbody></table>`;document.querySelectorAll('#qTable button[data-id]').forEach(b=>b.onclick=()=>openLead(b.dataset.id))}async function openLead(id){const u=await sb.from('leads').update({lead_status:'in_progress',worked_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',id);if(u.error){alert(u.error.message);return}sessionStorage.setItem('crm2_active_lead',id);window.location.href='../crm/'}boot();</script></body></html>
