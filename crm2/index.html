<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aaroogyam CRM2</title><style>body{font-family:Inter,Arial,sans-serif;margin:0;background:#f4f7f5;color:#173322}.top{background:#164b30;color:#fff;padding:14px 20px;display:flex;justify-content:space-between}.wrap{max-width:1200px;margin:auto;padding:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button{border:1px solid #cdd9cf;background:#fff;padding:10px 14px;border-radius:9px;font-weight:700;cursor:pointer}.tabs button.active{background:#164b30;color:#fff}.panel{background:#fff;border:1px solid #dfe7e1;border-radius:14px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{padding:14px;border:1px solid #dfe7e1;border-radius:12px}.stat b{display:block;font-size:24px;margin-top:5px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{padding:9px}.btn{border:0;background:#164b30;color:#fff;border-radius:9px;padding:10px 13px!important;font-weight:700}.btn.alt{background:#fff;color:#164b30;border:1px solid #164b30}input,select{border:1px solid #ccd8cf;border-radius:8px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{text-align:left;padding:9px;border-bottom:1px solid #edf1ee;font-size:13px}th{background:#f7faf7}.hidden{display:none}.msg{margin-top:10px;font-size:13px}.err{color:#a33}.ok{color:#176534}.small{font-size:12px;color:#66736b}</style></head><body><div class="top"><strong>Aaroogyam CRM2</strong><span id="who"></span></div><div class="wrap"><div id="login" class="panel"><h2>CRM2 Login</h2><div class="row"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="btn" onclick="login()">Login</button></div><div id="loginMsg" class="msg"></div></div><div id="app" class="hidden"><div class="tabs"><button data-tab="manager" onclick="tab('manager')">Manager Dashboard</button><button data-tab="upload" onclick="tab('upload')">CSV Upload</button><button data-tab="assign" onclick="tab('assign')">Lead Assignment</button><button data-tab="queue" onclick="tab('queue')">Today's Queue</button><a class="btn alt" href="../crm/">Existing CRM</a><button class="btn alt" onclick="logout()">Logout</button></div><section id="manager" class="tab panel"></section><section id="upload" class="tab panel hidden"></section><section id="assign" class="tab panel hidden"></section><section id="queue" class="tab panel hidden"></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let me=null;const $=id=>document.getElementById(id);function tab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));$(id).classList.remove('hidden');({manager:manager,upload:upload,assign:assign,queue:queue}[id])()}async function boot(){const{data:{user}}=await sb.auth.getUser();if(!user)return;me=user;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=user.email;tab('manager')}async function login(){const{data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent=error.message;$('loginMsg').className='msg err';return}location.reload()}async function logout(){await sb.auth.signOut();location.reload()}function manager(){ $('manager').innerHTML='<h2>Manager Daily Control</h2><div class="grid"><div class="stat">Assigned Today<b id="mAssigned">0</b></div><div class="stat">Worked<b id="mWorked">0</b></div><div class="stat">Pending<b id="mPending">0</b></div><div class="stat">Callbacks<b id="mCallback">0</b></div><div class="stat">Today Orders<b id="mOrders">0</b></div><div class="stat">Active Agents<b id="mAgents">0</b></div></div><table><thead><tr><th>Agent</th><th>Assigned</th><th>Worked</th><th>Pending</th><th>Callbacks</th></tr></thead><tbody id="mRows"></tbody></table>';loadManager()}async function loadManager(){const d=new Date().toISOString().slice(0,10);const{data:l}=await sb.from('leads').select('assigned_to,lead_status,assigned_at').not('assigned_to','is',null);const a=(l||[]).filter(x=>(x.assigned_at||'').slice(0,10)===d);$('mAssigned').textContent=a.length;$('mWorked').textContent=a.filter(x=>['in_progress','worked','callback','order'].includes(x.lead_status)).length;$('mPending').textContent=a.filter(x=>x.lead_status==='assigned').length;$('mCallback').textContent=a.filter(x=>x.lead_status==='callback').length;const{count}=await sb.from('orders').select('*',{count:'exact',head:true}).gte('created_at',d+'T00:00:00');$('mOrders').textContent=count||0;const{data:p}=await sb.from('profiles').select('id,full_name,role').eq('is_active',true).in('role',['agent','sales_agent']);const map={};(p||[]).forEach(x=>map[x.id]={name:x.full_name||x.id,a:0,w:0,p:0,c:0});a.forEach(x=>{const z=map[x.assigned_to];if(z){z.a++;if(x.lead_status==='assigned')z.p++;else z.w++;if(x.lead_status==='callback')z.c++}});$('mAgents').textContent=Object.values(map).filter(x=>x.a>0).length;$('mRows').innerHTML=Object.values(map).filter(x=>x.a>0).map(x=>`<tr><td>${x.name}</td><td>${x.a}</td><td>${x.w}</td><td>${x.p}</td><td>${x.c}</td></tr>`).join('')}function upload(){ $('upload').innerHTML='<h2>CSV / Excel Lead Upload</h2><p class="small">CSV columns: Mobile Number, Customer Name, Product Name, Address, City, State, Pincode</p><input id="file" type="file" accept=".csv,text/csv"><button class="btn" onclick="preview()">Preview CSV</button><div id="preview"></div>';window._rows=[]}function parseCSV(text){const lines=text.replace(/\r/g,'').split('\n').filter(x=>x.trim());const head=lines.shift().split(',').map(x=>x.trim().toLowerCase());const idx=n=>head.findIndex(h=>h===n||h.replace(/[^a-z]/g,'')===n.replace(/[^a-z]/g,''));return lines.map(line=>{let arr=[],cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){q=!q}else if(c===','&&!q){arr.push(cur.trim());cur=''}else cur+=c}arr.push(cur.trim());return{mobile:arr[idx('mobile')??idx('mobile number')]||'',customer_name:arr[idx('customer name')]||'',product_name:arr[idx('product name')]||'',address:arr[idx('address')]||'',city:arr[idx('city')]||'',state:arr[idx('state')]||'',pincode:arr[idx('pincode')]||''}})}async function preview(){const f=$('file').files[0];if(!f)return alert('Select CSV');const rows=parseCSV(await f.text());const valid=rows.filter(x=>/^[6-9]\d{9}$/.test(x.mobile));window._rows=valid;const invalid=rows.length-valid.length;$('preview').innerHTML=`<p class="ok">Total ${rows.length} · Valid ${valid.length} · Invalid ${invalid}</p><button class="btn" onclick="saveBatch('${f.name.replace(/'/g,'')} ',${invalid})">Import Valid Leads</button><table><thead><tr><th>Mobile</th><th>Name</th><th>Product</th><th>City</th></tr></thead><tbody>${valid.slice(0,100).map(x=>`<tr><td>${x.mobile}</td><td>${x.customer_name}</td><td>${x.product_name}</td><td>${x.city}</td></tr>`).join('')}</tbody></table>`}async function saveBatch(name,invalid){const rows=window._rows||[];const{data:b,error:be}=await sb.from('lead_batches').insert({file_name:name,total_records:rows.length+invalid,valid_records:rows.length,invalid_records:invalid,uploaded_by:me.id}).select('id').single();if(be)return alert(be.message);const payload=rows.map(x=>({...x,batch_id:b.id,lead_status:'new'}));const{error}=payload.length?await sb.from('leads').insert(payload):{error:null};if(error)return alert(error.message);$('preview').innerHTML='<p class="ok">Batch imported successfully.</p>';loadManager()}async function assign(){const{data:b}=await sb.from('lead_batches').select('id,file_name,created_at').order('created_at',{ascending:false});const{data:p}=await sb.from('profiles').select('id,full_name,role').eq('is_active',true).in('role',['agent','sales_agent']);$('assign').innerHTML=`<h2>Agent Assignment</h2><div class="row"><select id="abatch">${(b||[]).map(x=>`<option value="${x.id}">${x.file_name}</option>`).join('')}</select><select id="aagent">${(p||[]).map(x=>`<option value="${x.id}">${x.full_name||x.id}</option>`).join('')}</select><button class="btn" onclick="loadAssign()">Load</button><button class="btn" onclick="assignSelected()">Assign Selected</button></div><div id="aTable"></div>`}async function loadAssign(){const{data,error}=await sb.from('leads').select('*').eq('batch_id',$('abatch').value).is('assigned_to',null).eq('lead_status','new').limit(500);$('aTable').innerHTML=error?`<p class="err">${error.message}</p>`:`<p>${data.length} unassigned</p><table><thead><tr><th><input type="checkbox" onchange="document.querySelectorAll('.lid').forEach(x=>x.checked=this.checked)"></th><th>Mobile</th><th>Customer</th><th>Product</th><th>City</th></tr></thead><tbody>${data.map(x=>`<tr><td><input class="lid" type="checkbox" value="${x.id}"></td><td>${x.mobile}</td><td>${x.customer_name||''}</td><td>${x.product_name||''}</td><td>${x.city||''}</td></tr>`).join('')}</tbody></table>`}async function assignSelected(){const ids=[...document.querySelectorAll('.lid:checked')].map(x=>x.value);if(!ids.length)return alert('Select leads');const now=new Date().toISOString();const agent=$('aagent').value;const{error}=await sb.from('leads').update({assigned_to:agent,assigned_at:now,lead_status:'assigned',updated_at:now}).in('id',ids);if(error)return alert(error.message);const rows=ids.map(id=>({lead_id:id,agent_id:agent,assigned_by:me.id,assignment_date:new Date().toISOString().slice(0,10),status:'assigned'}));const{error:e}=await sb.from('lead_assignments').insert(rows);if(e)return alert(e.message);loadAssign();loadManager()}async function queue(){const{data,error}=await sb.from('leads').select('*').eq('assigned_to',me.id).in('lead_status',['assigned','in_progress','callback']).order('assigned_at',{ascending:true});$('queue').innerHTML=`<h2>Today's Calling Queue</h2><p>${error?error.message:`${(data||[]).length} active leads`}</p><table><thead><tr><th>Mobile</th><th>Customer</th><th>Product</th><th>City</th><th>Status</th><th>Action</th></tr></thead><tbody>${(data||[]).map(x=>`<tr><td>${x.mobile}</td><td>${x.customer_name||''}</td><td>${x.product_name||''}</td><td>${x.city||''}</td><td>${x.lead_status}</td><td><button class="btn" onclick="openLead('${x.id}')">Open</button></td></tr>`).join('')}</tbody></table>`}async function openLead(id){await sb.from('leads').update({lead_status:'in_progress',worked_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',id);sessionStorage.setItem('crm2_active_lead',id);window.location.href='../crm/'}boot();</script></body></html>
